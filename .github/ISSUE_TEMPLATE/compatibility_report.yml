name: Compatibility report
description: Report whether a specific application works with SnapLayouts 10.
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        This report helps keep docs/COMPATIBILITY.md accurate.
  - type: input
    id: app
    attributes:
      label: Application and version
      placeholder: "Google Chrome 142, Visual Studio Code 1.95..."
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows
      placeholder: "Windows 10 22H2, build 19045.6456, x64"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works fully
        - Menu appears, but snapping is incorrect
        - Menu does not appear
        - Application crashes or freezes
    validations:
      required: true
  - type: input
    id: state
    attributes:
      label: Window state
      placeholder: "Restored / maximized / both"
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Behavior, limitations, reproduction steps.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include personal data or sensitive screenshots.
          required: true
