name: Bug report
description: Report incorrect behavior or a crash.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include passwords, addresses, document titles, or other
        personal data. Logs can contain window titles — redact them before attaching.
  - type: input
    id: version
    attributes:
      label: SnapLayouts 10 version
      description: Shown in the tray menu under About, or in the archive name.
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      description: Win+R → winver. Include edition and build.
      placeholder: "Windows 10 IoT Enterprise 22H2, build 19045.6456"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Application that triggers the hover
      placeholder: "Notepad, Chrome, Explorer..."
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: Window state
      options:
        - Restored (Maximize button)
        - Maximized (Restore Down button)
        - Both
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Hover over ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log / screenshots (optional)
      description: From %APPDATA%\SnapLayouts10\snap.log. Remove sensitive titles.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using the latest version.
          required: true
        - label: I removed personal data from logs and screenshots.
          required: true
