name: Feature request
description: Suggest an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      placeholder: "I find it frustrating that..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Confirmation
      options:
        - label: This feature does not already exist in the latest version.
          required: true
        - label: The proposal respects the requirement to avoid PowerToys/FancyZones.
          required: false
